<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kobo Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --kobo-gold: #FFA500;
    --kobo-orange: #FF6B00;
    --kobo-dark: #0A1F44;
    --kobo-deep: #061530;
    --kobo-green: #10B981;
    --kobo-danger: #EF4444;
    --bg: #F7F9F8;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 30px; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  .loader { position: fixed; inset: 0; z-index: 9999; background: var(--kobo-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .5s, visibility .5s; }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .loader-logo span { color: var(--kobo-gold); }
  .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--kobo-gold); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: linear-gradient(135deg, var(--kobo-deep), var(--kobo-dark)); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .header-logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .logo .badge-admin { background: linear-gradient(135deg, var(--kobo-gold), var(--kobo-orange)); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; }
  .btn-exit { background: rgba(255,255,255,.15); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-exit svg { stroke: #fff; }
  .tabs { background: #fff; padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); position: sticky; top: 64px; z-index: 99; -ms-overflow-style: none; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; background: #f7faf8; color: var(--muted); border: none; cursor: pointer; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: all .2s; }
  .tab.active { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; box-shadow: 0 3px 10px rgba(255,107,0,.3); }
  .tab .tab-badge { background: var(--kobo-danger); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 8px; min-width: 18px; text-align: center; display: none; }
  .tab .tab-badge.show { display: inline-block; }
  .content { padding: 16px; max-width: 800px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-box { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); border-left: 4px solid var(--kobo-gold); animation: fadeInUp .4s ease forwards; }
  .stat-box:nth-child(2) { border-color: var(--kobo-orange); }
  .stat-box:nth-child(3) { border-color: var(--kobo-green); }
  .stat-box:nth-child(4) { border-color: #3b82f6; }
  .stat-box .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .3px; margin-bottom: 6px; }
  .stat-box .val { font-size: 20px; font-weight: 800; color: var(--text); }
  .admin-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .admin-toolbar h2 { font-size: 17px; font-weight: 800; color: var(--kobo-dark); }
  .btn-add { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; box-shadow: 0 3px 10px rgba(255,107,0,.3); }
  .item-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; align-items: flex-start; gap: 12px; animation: fadeInUp .35s ease forwards; }
  .item-card .ic-img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .item-card .ic-body { flex: 1; min-width: 0; }
  .item-card .ic-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .item-card .ic-meta { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .item-card .ic-meta .dot { color: #d1d5db; }
  .item-card .ic-desc { font-size: 12px; color: #4b5563; line-height: 1.5; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #f3f4f6; }
  .item-card .ic-actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .icon-btn { width: 32px; height: 32px; border-radius: 9px; background: #f7faf8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .3px; }
  .badge.green { background: rgba(16,185,129,.15); color: #166534; }
  .badge.orange { background: rgba(255,107,0,.15); color: var(--kobo-orange); }
  .badge.red { background: rgba(239,68,68,.15); color: var(--kobo-danger); }
  .badge.blue { background: rgba(59,130,246,.15); color: #2563eb; }
  .badge.gray { background: rgba(107,114,128,.15); color: #4b5563; }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -ms-overflow-style: none; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #fff; border: 1.5px solid var(--border); color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .filter-chip.active { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; border-color: transparent; }
  .search-full { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-family: inherit; font-size: 13px; outline: none; margin-bottom: 12px; }
  .search-full:focus { border-color: var(--kobo-gold); }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; background: #fff; border-radius: 14px; }
  .modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal { background: #fff; width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; transform: translateY(100%); transition: transform .4s cubic-bezier(.4,0,.2,1); max-height: 92vh; overflow-y: auto; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--kobo-dark); }
  .modal-close { width: 34px; height: 34px; border-radius: 50%; background: #f3f4f6; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: var(--kobo-dark); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: #f7faf8; outline: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--kobo-gold); background: #fff; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-check { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .form-check input { width: auto; }
  .form-check label { margin: 0; font-size: 13px; font-weight: 600; }
  .btn-primary, .btn-danger, .btn-warn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; }
  .btn-danger { background: linear-gradient(135deg, #b91c1c, #dc2626); color: #fff; }
  .btn-warn { background: #f3f4f6; color: #374151; }
  .config-group { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .config-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
  .config-row:last-child { border-bottom: none; }
  .config-row .cr-info { flex: 1; min-width: 0; }
  .config-row .cr-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .config-row .cr-cle { font-size: 10.5px; color: var(--muted); font-family: monospace; }
  .config-row input { width: 120px; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 14px; font-weight: 700; text-align: right; font-family: inherit; outline: none; background: #f7faf8; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--kobo-dark); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: all .3s; z-index: 1000; display: flex; align-items: center; gap: 8px; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #b91c1c; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-logo">KOBO<span> Admin</span></div>
  <div class="spinner"></div>
</div>

<header class="header">
  <div class="header-logo-wrap">
    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFA500,#FF6B00);display:flex;align-items:center;justify-content:center;font-weight:900;color:#0A1F44;font-size:18px;">K</div>
    <div class="logo">Kobo <span class="badge-admin">Admin</span></div>
  </div>
  <button class="btn-exit" onclick="location.reload()">⟳</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="stats">📊 Stats</button>
  <button class="tab" data-tab="retraits">💸 Retraits <span class="tab-badge" id="retraitsBadge"></span></button>
  <button class="tab" data-tab="tasks">🎯 Tâches</button>
  <button class="tab" data-tab="users">👥 Users</button>
  <button class="tab" data-tab="parrainage">🤝 Parrainage</button>
  <button class="tab" data-tab="settings">⚙️ Réglages</button>
  <button class="tab" data-tab="broadcast">📢 Annonce</button>
</nav>

<main class="content">
  <div class="panel active" id="panel-stats">
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="panel" id="panel-retraits">
    <div class="admin-toolbar"><h2>Retraits</h2><span class="badge orange" id="retraitsPendingBadge">—</span></div>
    <input type="text" class="search-full" id="retraitsSearch" placeholder="🔍 Rechercher..." oninput="renderRetraits()">
    <div class="filter-row" id="retraitsFilters">
      <button class="filter-chip active" data-filter="pending">En attente</button>
      <button class="filter-chip" data-filter="paid">Payés</button>
      <button class="filter-chip" data-filter="rejected">Rejetés</button>
      <button class="filter-chip" data-filter="all">Tous</button>
    </div>
    <div id="retraitsList"></div>
  </div>

  <div class="panel" id="panel-tasks">
    <div class="admin-toolbar"><h2>Tâches</h2><button class="btn-add" onclick="openTaskModal()">➕ Nouvelle</button></div>
    <input type="text" class="search-full" id="tasksSearch" placeholder="🔍 Rechercher..." oninput="renderTasks()">
    <div id="tasksList"></div>
  </div>

  <div class="panel" id="panel-users">
    <div class="admin-toolbar"><h2>Utilisateurs</h2><span class="badge blue" id="usersCountBadge">—</span></div>
    <input type="text" class="search-full" id="usersSearch" placeholder="🔍 Rechercher..." oninput="renderUsers()">
    <div id="usersList"></div>
  </div>

  <div class="panel" id="panel-parrainage">
    <div class="admin-toolbar"><h2>Réseau de parrainage</h2></div>
    <div class="stats-grid" id="parrainStats"></div>
    <input type="text" class="search-full" id="parrainSearch" placeholder="🔍 Rechercher..." oninput="renderParrainage()">
    <div id="parrainList"></div>
  </div>

  <div class="panel" id="panel-settings">
    <div class="admin-toolbar"><h2>Paramètres</h2><button class="btn-add" onclick="saveAllSettings()">💾 Enregistrer</button></div>
    <input type="text" class="search-full" id="settingsSearch" placeholder="🔍 Rechercher..." oninput="renderSettings()">
    <div id="settingsList"></div>
  </div>

  <div class="panel" id="panel-broadcast">
    <div class="admin-toolbar"><h2>📢 Annonce aux users</h2></div>
    <div class="config-group">
      <div class="form-group">
        <label>Message</label>
        <textarea id="broadcastMsg" rows="5" placeholder="Ton message..."></textarea>
      </div>
      <button class="btn-primary" onclick="sendBroadcast()">📢 Envoyer à tous</button>
      <div style="margin-top:12px;font-size:12px;color:#6b7280;" id="broadcastStatus"></div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Titre</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText">—</span></div>

<script>
// ============================================================
// CONFIG — Utilise l'API Vercel (service_role en sécurité)
// ============================================================
const API = '/admin/api/admin/data';

async function apiGet(resource) {
  const r = await fetch(`${API}?resource=${resource}`);
  return r.json();
}
async function apiSend(resource, method, body) {
  const r = await fetch(`${API}?resource=${resource}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

let DATA = { retraits: [], tasks: [], users: [], settings: [] };
let RETRAIT_FILTER = 'pending';

// ============================================================
// INIT
// ============================================================
(async function init() {
  try {
    const [retraits, tasks, users, settings] = await Promise.all([
      apiGet('withdrawals'),
      apiGet('tasks'),
      apiGet('users'),
      apiGet('settings'),
    ]);
    DATA.retraits = retraits.data || [];
    DATA.tasks = tasks.data || [];
    DATA.users = users.data || [];
    DATA.settings = settings.data || [];

    await loadStats();
    renderRetraits();
    renderTasks();
    renderUsers();
    renderParrainage();
    renderSettings();

    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 200);
  } catch (e) {
    console.error(e);
    document.getElementById('loader').innerHTML = '<div style="color:#fff;padding:20px;text-align:center;">Erreur de chargement : ' + e.message + '</div>';
  }
})();

// ============================================================
// TABS
// ============================================================
document.getElementById('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

// ============================================================
// STATS
// ============================================================
async function loadStats() {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '<div class="stat-box"><div class="lbl">Chargement...</div><div class="val">—</div></div>';
  const s = await apiGet('stats');

  const stats = [
    { l: 'Utilisateurs', v: s.totalUsers || 0 },
    { l: 'Bannis', v: s.bannedUsers || 0 },
    { l: 'Retraits en attente', v: s.pendingWD || 0 },
    { l: 'Kobo en circulation', v: Math.round(s.totalKobo || 0) },
    { l: 'Total distribué', v: Math.round(s.totalEarned || 0) },
    { l: 'Total retiré', v: Math.round(s.totalWithdrawn || 0) },
  ];
  grid.innerHTML = stats.map(x => `<div class="stat-box"><div class="lbl">${x.l}</div><div class="val">${x.v}</div></div>`).join('');

  const badge = document.getElementById('retraitsBadge');
  if (s.pendingWD > 0) { badge.textContent = s.pendingWD; badge.classList.add('show'); }
  else badge.classList.remove('show');
}

// ============================================================
// RETRAITS
// ============================================================
function renderRetraits() {
  const list = document.getElementById('retraitsList');
  const q = (document.getElementById('retraitsSearch')?.value || '').toLowerCase().trim();
  let f = RETRAIT_FILTER === 'all' ? DATA.retraits : DATA.retraits.filter(r => r.status === RETRAIT_FILTER);
  if (q) f = f.filter(r => { const u = r.users || {}; return (u.first_name||'').toLowerCase().includes(q) || (u.username||'').toLowerCase().includes(q) || (r.destination||'').toLowerCase().includes(q); });

  const pending = DATA.retraits.filter(r => r.status === 'pending').length;
  document.getElementById('retraitsPendingBadge').textContent = pending + ' en attente';

  if (f.length === 0) { list.innerHTML = emptyBox('Aucun retrait'); return; }
  list.innerHTML = f.map(r => {
    const u = r.users || {};
    const s = { pending: {l:'En attente',c:'orange'}, paid: {l:'Payé',c:'green'}, rejected: {l:'Rejeté',c:'red'} }[r.status] || {l:r.status,c:'gray'};
    return `<div class="item-card">
      <div class="ic-img">💸</div>
      <div class="ic-body">
        <div class="ic-name">${escapeHtml(u.first_name||'Utilisateur')} <span class="badge ${s.c}">${s.l}</span></div>
        <div class="ic-meta"><span>💰 ${r.amount_kobo} Kobo</span><span class="dot">•</span><span style="color:var(--kobo-orange);font-weight:700;">${r.amount_target} ${r.target_currency}</span></div>
        <div class="ic-meta"><span>📱 ${escapeHtml(r.method)}</span><span class="dot">•</span><span>📍 ${escapeHtml(r.destination)}</span></div>
        <div class="ic-meta" style="font-size:10.5px;"><span>${timeAgo(r.created_at)} · ID #${r.id}</span></div>
      </div>
      <div class="ic-actions">${r.status === 'pending' ? `
        <button class="icon-btn" onclick="wdAction(${r.id}, 'paid')" title="Payé">✅</button>
        <button class="icon-btn" onclick="wdAction(${r.id}, 'rejected')" title="Rejeter">❌</button>
      ` : ''}</div>
    </div>`;
  }).join('');
}

document.getElementById('retraitsFilters').addEventListener('click', (e) => {
  const c = e.target.closest('.filter-chip'); if (!c) return;
  document.querySelectorAll('#retraitsFilters .filter-chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active'); RETRAIT_FILTER = c.dataset.filter; renderRetraits();
});

async function wdAction(id, status) {
  if (!confirm(`Confirmer ${status === 'paid' ? 'le paiement' : 'le refus'} ?`)) return;
  const r = await apiSend('withdrawal', 'PATCH', { id, status });
  if (r.error) return showToast('Erreur : ' + r.error, true);
  showToast('OK');
  const idx = DATA.retraits.findIndex(x => x.id === id); if (idx >= 0) DATA.retraits[idx].status = status;
  renderRetraits(); loadStats();
}

// ============================================================
// TÂCHES
// ============================================================
function renderTasks() {
  const list = document.getElementById('tasksList');
  const q = (document.getElementById('tasksSearch')?.value || '').toLowerCase().trim();
  let f = DATA.tasks;
  if (q) f = f.filter(t => (t.title||'').toLowerCase().includes(q));
  if (f.length === 0) { list.innerHTML = emptyBox('Aucune tâche'); return; }
  list.innerHTML = f.map(t => `<div class="item-card">
    <div class="ic-img">${t.is_active ? '🎯' : '🚫'}</div>
    <div class="ic-body">
      <div class="ic-name">${escapeHtml(t.title)} ${t.is_active ? '' : '<span class="badge red">Inactif</span>'}</div>
      <div class="ic-meta"><span class="badge blue">${t.type}</span><span class="dot">•</span><span style="color:var(--kobo-orange);font-weight:700;">💰 ${t.reward} Kobo</span></div>
      ${t.description ? `<div class="ic-desc">${escapeHtml(t.description)}</div>` : ''}
    </div>
    <div class="ic-actions">
      <button class="icon-btn" onclick="openTaskModal(${t.id})">✏️</button>
      <button class="icon-btn" onclick="toggleTask(${t.id})">${t.is_active ? '⏸️' : '▶️'}</button>
      <button class="icon-btn" onclick="deleteTask(${t.id})">🗑️</button>
    </div>
  </div>`).join('');
}

function openTaskModal(id = null) {
  const t = id ? DATA.tasks.find(x => x.id === id) : { title:'', description:'', type:'one_time', reward:0, link:'', channel_id:'', daily_limit:1, is_active:true };
  openModal(id ? 'Modifier' : 'Nouvelle tâche', `
    <div class="form-group"><label>Titre</label><input id="tTitle" value="${escapeHtml(t.title)}"></div>
    <div class="form-group"><label>Description</label><textarea id="tDesc">${escapeHtml(t.description||'')}</textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Type</label><select id="tType">${['one_time','daily','channel_join','watch_ad','share_link','signup','custom'].map(v => `<option ${t.type===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="form-group"><label>Récompense Kobo</label><input type="number" id="tReward" value="${t.reward}"></div>
    </div>
    <div class="form-group"><label>Lien</label><input id="tLink" value="${escapeHtml(t.link||'')}"></div>
    <div class="form-row">
      <div class="form-group"><label>ID Canal</label><input id="tChannel" value="${escapeHtml(t.channel_id||'')}"></div>
      <div class="form-group"><label>Limite/jour</label><input type="number" id="tDaily" value="${t.daily_limit || 1}"></div>
    </div>
    <div class="form-check"><input type="checkbox" id="tActive" ${t.is_active?'checked':''}><label for="tActive">Active</label></div>
    <button class="btn-primary" onclick="saveTask(${id || 'null'})">💾 Enregistrer</button>
  `);
}

async function saveTask(id) {
  const payload = {
    title: document.getElementById('tTitle').value.trim(),
    description: document.getElementById('tDesc').value.trim() || null,
    type: document.getElementById('tType').value,
    reward: Number(document.getElementById('tReward').value),
    link: document.getElementById('tLink').value.trim() || null,
    channel_id: document.getElementById('tChannel').value.trim() || null,
    daily_limit: Number(document.getElementById('tDaily').value),
    is_active: document.getElementById('tActive').checked
  };
  if (!payload.title) return showToast('Titre requis', true);
  const r = id ? await apiSend('task', 'PATCH', { id, ...payload }) : await apiSend('task', 'POST', payload);
  if (r.error) return showToast('Erreur : ' + r.error, true);
  showToast(id ? 'Modifié' : 'Créée');
  closeModal();
  const tasks = await apiGet('tasks'); DATA.tasks = tasks.data || [];
  renderTasks();
}

async function toggleTask(id) {
  const t = DATA.tasks.find(x => x.id === id); if (!t) return;
  await apiSend('task', 'PATCH', { id, is_active: !t.is_active });
  const tasks = await apiGet('tasks'); DATA.tasks = tasks.data || [];
  renderTasks();
}

async function deleteTask(id) {
  if (!confirm('Supprimer ?')) return;
  await apiSend('task', 'DELETE', { id });
  showToast('Supprimée');
  const tasks = await apiGet('tasks'); DATA.tasks = tasks.data || [];
  renderTasks();
}

// ============================================================
// USERS
// ============================================================
function renderUsers() {
  const list = document.getElementById('usersList');
  const q = (document.getElementById('usersSearch')?.value || '').toLowerCase().trim();
  let f = DATA.users;
  if (q) f = f.filter(u => (u.first_name||'').toLowerCase().includes(q) || (u.username||'').toLowerCase().includes(q) || String(u.telegram_id).includes(q));
  document.getElementById('usersCountBadge').textContent = DATA.users.length + ' users';
  if (f.length === 0) { list.innerHTML = emptyBox('Aucun utilisateur'); return; }
  list.innerHTML = f.slice(0, 100).map(u => `
    <div class="item-card">
      <div class="ic-img" style="background:linear-gradient(135deg,#FF6B00,#FFA500);color:#fff;font-weight:900;">${escapeHtml((u.first_name || u.username || '?').charAt(0).toUpperCase())}</div>
      <div class="ic-body">
        <div class="ic-name">${escapeHtml(u.first_name || 'Utilisateur')} ${u.is_banned ? '<span class="badge red">Banni</span>' : ''} ${u.is_admin ? '<span class="badge orange">Admin</span>' : ''}</div>
        <div class="ic-meta"><span>@${escapeHtml(u.username || '—')}</span><span class="dot">•</span><span>ID ${u.telegram_id}</span></div>
        <div class="ic-meta"><span style="color:var(--kobo-orange);font-weight:800;">💰 ${u.balance} Kobo</span><span class="dot">•</span><span>retirable ${u.withdrawable_balance || 0}</span></div>
      </div>
      <div class="ic-actions">
        <button class="icon-btn" onclick="editUser(${u.telegram_id})" title="Modifier">✏️</button>
        <button class="icon-btn" onclick="toggleBan(${u.telegram_id})" title="${u.is_banned ? 'Débannir' : 'Bannir'}">${u.is_banned ? '🔓' : '🚫'}</button>
      </div>
    </div>
  `).join('');
}

function editUser(id) {
  const u = DATA.users.find(x => x.telegram_id === id); if (!u) return;
  openModal('Modifier ' + (u.first_name || 'Utilisateur'), `
    <div class="form-group"><label>Prénom</label><input id="euName" value="${escapeHtml(u.first_name || '')}"></div>
    <div class="form-group"><label>Solde Kobo</label><input type="number" id="euBalance" value="${u.balance}"></div>
    <div class="form-group"><label>Solde retirable</label><input type="number" id="euWithdrawable" value="${u.withdrawable_balance || 0}"></div>
    <div class="form-check"><input type="checkbox" id="euAdmin" ${u.is_admin?'checked':''}><label>Admin</label></div>
    <div class="form-check"><input type="checkbox" id="euBanned" ${u.is_banned?'checked':''}><label>Banni</label></div>
    <button class="btn-primary" onclick="saveUser(${id})">💾 Enregistrer</button>
  `);
}

async function saveUser(id) {
  const payload = {
    telegram_id: id,
    first_name: document.getElementById('euName').value.trim(),
    balance: Number(document.getElementById('euBalance').value),
    withdrawable_balance: Number(document.getElementById('euWithdrawable').value),
    is_admin: document.getElementById('euAdmin').checked,
    is_banned: document.getElementById('euBanned').checked
  };
  const r = await apiSend('user', 'PATCH', payload);
  if (r.error) return showToast('Erreur : ' + r.error, true);
  showToast('Mis à jour'); closeModal();
  const users = await apiGet('users'); DATA.users = users.data || [];
  renderUsers();
}

async function toggleBan(id) {
  const u = DATA.users.find(x => x.telegram_id === id); if (!u) return;
  if (!confirm(u.is_banned ? 'Débannir ?' : 'Bannir ?')) return;
  await apiSend('user', 'PATCH', { telegram_id: id, is_banned: !u.is_banned });
  showToast(u.is_banned ? 'Débanni' : 'Banni');
  const users = await apiGet('users'); DATA.users = users.data || [];
  renderUsers(); loadStats();
}

// ============================================================
// PARRAINAGE
// ============================================================
function renderParrainage() {
  const list = document.getElementById('parrainList');
  const stats = document.getElementById('parrainStats');

  const groups = {};
  DATA.users.forEach(u => {
    if (!u.referred_by) return;
    if (!groups[u.referred_by]) {
      const parrain = DATA.users.find(x => x.telegram_id === u.referred_by);
      groups[u.referred_by] = { parrain: parrain || { telegram_id: u.referred_by, first_name: 'Inconnu' }, filleuls: [] };
    }
    groups[u.referred_by].filleuls.push(u);
  });
  const arr = Object.values(groups).sort((a, b) => b.filleuls.length - a.filleuls.length);

  stats.innerHTML = `
    <div class="stat-box"><div class="lbl">Parrains actifs</div><div class="val">${arr.length}</div></div>
    <div class="stat-box" style="border-color:var(--kobo-orange);"><div class="lbl">Total filleuls</div><div class="val">${DATA.users.filter(u => u.referred_by).length}</div></div>
  `;

  const q = (document.getElementById('parrainSearch')?.value || '').toLowerCase().trim();
  let f = arr;
  if (q) f = f.filter(g => (g.parrain.first_name||'').toLowerCase().includes(q) || (g.parrain.username||'').toLowerCase().includes(q));
  if (f.length === 0) { list.innerHTML = emptyBox('Aucun parrain'); return; }

  list.innerHTML = f.slice(0, 50).map(g => {
    const p = g.parrain; const c = g.filleuls.length;
    return `<div class="item-card">
      <div class="ic-img" style="background:linear-gradient(135deg,#FF6B00,#FFA500);color:#fff;font-weight:900;">${escapeHtml((p.first_name||'?').charAt(0).toUpperCase())}</div>
      <div class="ic-body">
        <div class="ic-name">${escapeHtml(p.first_name || 'Inconnu')} <span class="badge orange">${c} filleul${c>1?'s':''}</span></div>
        <div class="ic-meta"><span>@${escapeHtml(p.username || '—')}</span><span class="dot">•</span><span>💰 ${p.balance || 0} Kobo</span></div>
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// SETTINGS
// ============================================================
function renderSettings() {
  const list = document.getElementById('settingsList');
  const q = (document.getElementById('settingsSearch')?.value || '').toLowerCase().trim();
  let f = DATA.settings;
  if (q) f = f.filter(s => s.key.toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q));
  if (f.length === 0) { list.innerHTML = emptyBox('Aucun paramètre'); return; }
  list.innerHTML = `<div class="config-group">${f.map(s => `
    <div class="config-row">
      <div class="cr-info">
        <div class="cr-label">${escapeHtml(s.description || s.key)}</div>
        <div class="cr-cle">${escapeHtml(s.key)}</div>
      </div>
      <input type="text" value='${JSON.stringify(s.value).replace(/'/g, "&#39;")}' data-key="${s.key}" class="setting-input">
    </div>
  `).join('')}</div>`;
}

async function saveAllSettings() {
  const inputs = document.querySelectorAll('.setting-input');
  if (inputs.length === 0) return;
  let ok = 0, err = 0;
  for (const input of inputs) {
    let value;
    try { value = JSON.parse(input.value); } catch { value = input.value; }
    const r = await apiSend('setting', 'PATCH', { key: input.dataset.key, value });
    if (r.error) err++; else ok++;
  }
  if (err > 0) showToast(`${ok} ok, ${err} erreurs`, true);
  else showToast(`✅ ${ok} paramètre(s)`);
}

// ============================================================
// BROADCAST
// ============================================================
async function sendBroadcast() {
  const msg = document.getElementById('broadcastMsg').value.trim();
  if (!msg) return showToast('Message vide', true);
  if (!confirm('Envoyer à TOUS les users ?')) return;
  const status = document.getElementById('broadcastStatus');
  status.textContent = '⏳ Envoi...';
  try {
    const r = await fetch('/api/admin/broadcast', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await r.json();
    if (data.ok) {
      status.textContent = `✅ Envoyé à ${data.sent} users (${data.failed} échecs)`;
      document.getElementById('broadcastMsg').value = '';
    } else {
      status.textContent = '❌ ' + (data.error || 'Erreur');
    }
  } catch (e) { status.textContent = '❌ ' + e.message; }
}

// ============================================================
// UTILITAIRES
// ============================================================
function openModal(title, html) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function closeModalOutside(e) { if (e.target.id === 'modalOverlay') closeModal(); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function emptyBox(msg) { return `<div class="empty">${msg}</div>`; }
function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return 'À l\'instant';
  if (diff < 3600) return `Il y a ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `Il y a ${Math.floor(diff/3600)} h`;
  if (diff < 604800) return `Il y a ${Math.floor(diff/86400)} j`;
  return new Date(iso).toLocaleDateString('fr-FR');
}
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
