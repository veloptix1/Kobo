<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kobo Admin — Boutique & Recharges</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --kobo-gold: #FFA500;
    --kobo-orange: #FF6B00;
    --kobo-dark: #0A1F44;
    --kobo-green: #10B981;
    --kobo-danger: #EF4444;
    --bg: #F7F9F8;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .loader { position: fixed; inset: 0; z-index: 9999; background: var(--kobo-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .5s; }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo { font-size: 22px; font-weight: 700; color: #fff; }
  .loader-logo span { color: var(--kobo-gold); }
  .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--kobo-gold); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: linear-gradient(135deg, #061530, var(--kobo-dark)); color: #fff; }
  .header-logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .logo .badge-admin { background: linear-gradient(135deg, var(--kobo-gold), var(--kobo-orange)); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; }
  .btn-exit { background: rgba(255,255,255,.15); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: #fff; font-size: 18px; }
  .tabs { background: #fff; padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); position: sticky; top: 64px; z-index: 99; }
  .tab { padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; background: #f7faf8; color: var(--muted); border: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .tab.active { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; }
  .content { padding: 16px; max-width: 900px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-box { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); border-left: 4px solid var(--kobo-gold); }
  .stat-box.green { border-color: var(--kobo-green); }
  .stat-box.orange { border-color: var(--kobo-orange); }
  .stat-box.blue { border-color: #3b82f6; }
  .stat-box.red { border-color: var(--kobo-danger); }
  .stat-box .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .stat-box .val { font-size: 20px; font-weight: 800; }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .filter-chip { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #fff; border: 1.5px solid var(--border); color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .filter-chip.active { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; border-color: transparent; }
  .search-full { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border); font-family: inherit; font-size: 13px; outline: none; margin-bottom: 12px; }
  .item-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; align-items: flex-start; gap: 12px; }
  .item-card .ic-img { width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .item-card .ic-body { flex: 1; min-width: 0; }
  .item-card .ic-name { font-size: 14px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .item-card .ic-meta { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .item-card .ic-meta .dot { color: #d1d5db; }
  .item-card .ic-desc { font-size: 12px; color: #4b5563; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #f3f4f6; }
  .item-card .ic-actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .icon-btn { width: 36px; height: 36px; border-radius: 9px; background: #f7faf8; border: none; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; }
  .badge.green { background: rgba(16,185,129,.15); color: #166534; }
  .badge.orange { background: rgba(255,107,0,.15); color: var(--kobo-orange); }
  .badge.red { background: rgba(239,68,68,.15); color: var(--kobo-danger); }
  .badge.blue { background: rgba(59,130,246,.15); color: #2563eb; }
  .badge.gray { background: rgba(107,114,128,.15); color: #4b5563; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; background: #fff; border-radius: 14px; }
  .modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal { background: #fff; width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform .4s; max-height: 92vh; overflow-y: auto; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--kobo-dark); }
  .modal-close { width: 34px; height: 34px; border-radius: 50%; background: #f3f4f6; border: none; cursor: pointer; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: var(--kobo-dark); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: #f7faf8; outline: none; }
  .btn-primary, .btn-danger, .btn-secondary { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
  .btn-primary { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; }
  .btn-danger { background: linear-gradient(135deg, #b91c1c, #dc2626); color: #fff; }
  .btn-secondary { background: #f3f4f6; color: #374151; }
  .btn-add { background: linear-gradient(135deg, var(--kobo-orange), var(--kobo-gold)); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .admin-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .admin-toolbar h2 { font-size: 17px; font-weight: 800; color: var(--kobo-dark); }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--kobo-dark); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s; z-index: 1000; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #b91c1c; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-logo">KOBO<span> Shop Admin</span></div>
  <div class="spinner"></div>
</div>

<header class="header">
  <div class="header-logo-wrap">
    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFA500,#FF6B00);display:flex;align-items:center;justify-content:center;font-weight:900;color:#0A1F44;font-size:18px;">K</div>
    <div class="logo">Kobo <span class="badge-admin">Shop Admin</span></div>
  </div>
  <button class="btn-exit" onclick="location.href='/admin/panel.html'">←</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="purchases">🛒 Achats Kobo</button>
  <button class="tab" data-tab="recharges">💳 Recharges</button>
  <button class="tab" data-tab="packs">📦 Packs</button>
  <button class="tab" data-tab="stats">📊 Statistiques</button>
</nav>

<main class="content">
  <div class="panel active" id="panel-purchases">
    <div class="admin-toolbar"><h2>🛒 Achats de Kobo</h2><span class="badge orange" id="purchasesBadge">—</span></div>
    <input type="text" class="search-full" id="purchasesSearch" placeholder="🔍 Rechercher..." oninput="renderPurchases()">
    <div class="filter-row" id="purchasesFilters">
      <button class="filter-chip active" data-filter="all">Tous</button>
      <button class="filter-chip" data-filter="paid">✅ Payés</button>
      <button class="filter-chip" data-filter="pending">⏳ En attente</button>
      <button class="filter-chip" data-filter="rejected">❌ Rejetés</button>
    </div>
    <div id="purchasesList"></div>
  </div>

  <div class="panel" id="panel-recharges">
    <div class="admin-toolbar"><h2>💳 Recharges</h2><span class="badge orange" id="rechargesBadge">—</span></div>
    <input type="text" class="search-full" id="rechargesSearch" placeholder="🔍 Rechercher..." oninput="renderRecharges()">
    <div class="filter-row" id="rechargesFilters">
      <button class="filter-chip active" data-filter="all">Tous</button>
      <button class="filter-chip" data-filter="paid">✅ Payés</button>
      <button class="filter-chip" data-filter="pending">⏳ En attente</button>
      <button class="filter-chip" data-filter="rejected">❌ Rejetés</button>
    </div>
    <div id="rechargesList"></div>
  </div>

  <div class="panel" id="panel-packs">
    <div class="admin-toolbar"><h2>📦 Packs de Kobo</h2><button class="btn-add" onclick="openPackModal()">➕ Nouveau</button></div>
    <div id="packsList"></div>
  </div>

  <div class="panel" id="panel-stats">
    <div class="admin-toolbar"><h2>📊 Statistiques</h2></div>
    <div id="statsList"></div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Titre</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText">—</span></div>

<script>
let DATA = { purchases: [], recharges: [], packs: [], stats: {} };
let P_FILTER = 'all';
let R_FILTER = 'all';

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function emptyBox(msg) { return '<div class="empty">' + msg + '</div>'; }
function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return 'À l\'instant';
  if (diff < 3600) return 'Il y a ' + Math.floor(diff/60) + ' min';
  if (diff < 86400) return 'Il y a ' + Math.floor(diff/3600) + ' h';
  if (diff < 604800) return 'Il y a ' + Math.floor(diff/86400) + ' j';
  return new Date(iso).toLocaleDateString('fr-FR');
}
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function openModal(title, html) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function closeModalOutside(e) { if (e.target.id === 'modalOverlay') closeModal(); }
function formatMoney(n) { return Math.round(Number(n || 0)).toLocaleString('fr-FR'); }

// ==================== INIT ====================
(async function init() {
  try {
    await loadPurchases();
    await loadRecharges();
    await loadPacks();
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 300);
  } catch (e) {
    console.error(e);
    document.getElementById('loader').innerHTML = '<div style="color:white;padding:20px;">Erreur : ' + e.message + '</div>';
  }
})();

document.getElementById('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

// ==================== PURCHASES ====================
async function loadPurchases() {
  const r = await fetch('/admin/api/admin/shop?resource=purchases&status=' + P_FILTER);
  const d = await r.json();
  if (d.ok) {
    DATA.purchases = d.purchases || [];
    DATA.stats.purchases = d.stats || {};
    const badge = document.getElementById('purchasesBadge');
    if (badge) badge.textContent = (d.stats.pending || 0) + ' en attente';
    renderPurchases();
  }
}

function renderPurchases() {
  const list = document.getElementById('purchasesList');
  const q = (document.getElementById('purchasesSearch')?.value || '').toLowerCase().trim();
  let f = DATA.purchases;
  if (q) f = f.filter(p => {
    const u = p.users || {};
    return (u.first_name || '').toLowerCase().includes(q) || (u.username || '').toLowerCase().includes(q) || String(u.telegram_id).includes(q);
  });

  if (f.length === 0) { list.innerHTML = emptyBox('Aucun achat'); return; }

  list.innerHTML = f.map(p => {
    const u = p.users || {};
    const statusMap = { paid: { l: '✅ Payé', c: 'green' }, pending: { l: '⏳ En attente', c: 'orange' }, rejected: { l: '❌ Rejeté', c: 'red' } };
    const s = statusMap[p.status] || { l: p.status, c: 'gray' };
    const totalKobo = Number(p.kobo_received) + Number(p.bonus_kobo || 0);
    return '<div class="item-card">' +
      '<div class="ic-img">🛒</div>' +
      '<div class="ic-body">' +
        '<div class="ic-name">' + escapeHtml(u.first_name || 'User') + ' <span class="badge ' + s.c + '">' + s.l + '</span></div>' +
        '<div class="ic-meta"><span>📦 ' + escapeHtml(p.kobo_packs?.name || 'Pack') + '</span></div>' +
        '<div class="ic-meta"><span>💵 ' + formatMoney(p.amount_paid) + ' ' + escapeHtml(p.currency) + '</span><span class="dot">•</span><span style="color:var(--kobo-orange);font-weight:700;">🪙 ' + formatMoney(totalKobo) + ' Kobo</span></div>' +
        '<div class="ic-meta" style="font-size:10.5px;"><span>ID ' + (u.telegram_id || '—') + '</span><span class="dot">•</span><span>' + timeAgo(p.created_at) + '</span></div>' +
        (p.proof ? '<div class="ic-desc">🔑 LeekPay : ' + escapeHtml(p.proof) + '</div>' : '') +
        (p.admin_note ? '<div class="ic-desc">📝 ' + escapeHtml(p.admin_note) + '</div>' : '') +
      '</div>' +
      '<div class="ic-actions">' +
        (p.status === 'pending' ?
          '<button class="icon-btn" onclick="approvePurchase(' + p.id + ')" title="Approuver">✅</button>' +
          '<button class="icon-btn" onclick="rejectPurchase(' + p.id + ')" title="Rejeter">❌</button>'
          : '') +
      '</div>' +
    '</div>';
  }).join('');
}

document.getElementById('purchasesFilters').addEventListener('click', (e) => {
  const c = e.target.closest('.filter-chip'); if (!c) return;
  document.querySelectorAll('#purchasesFilters .filter-chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  P_FILTER = c.dataset.filter;
  loadPurchases();
});

async function approvePurchase(id) {
  if (!confirm('Approuver cet achat et créditer les Kobo ?')) return;
  const r = await fetch('/admin/api/admin/shop', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resource: 'purchase', id, action: 'approve' }),
  });
  const d = await r.json();
  if (d.error) return showToast('Erreur : ' + d.error, true);
  showToast('✅ +' + formatMoney(d.kobo) + ' Kobo crédités');
  loadPurchases();
}

async function rejectPurchase(id) {
  const reason = prompt('Motif du rejet :');
  if (!reason) return;
  await fetch('/admin/api/admin/shop', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resource: 'purchase', id, action: 'reject', reason }),
  });
  showToast('❌ Achat rejeté');
  loadPurchases();
}

// ==================== RECHARGES ====================
async function loadRecharges() {
  const r = await fetch('/admin/api/admin/shop?resource=recharges&status=' + R_FILTER);
  const d = await r.json();
  if (d.ok) {
    DATA.recharges = d.recharges || [];
    DATA.stats.recharges = d.stats || {};
    const badge = document.getElementById('rechargesBadge');
    if (badge) badge.textContent = (d.stats.pending || 0) + ' en attente';
    renderRecharges();
  }
}

function renderRecharges() {
  const list = document.getElementById('rechargesList');
  const q = (document.getElementById('rechargesSearch')?.value || '').toLowerCase().trim();
  let f = DATA.recharges;
  if (q) f = f.filter(r => {
    const u = r.users || {};
    return (u.first_name || '').toLowerCase().includes(q) || (u.username || '').toLowerCase().includes(q) || String(u.telegram_id).includes(q);
  });

  if (f.length === 0) { list.innerHTML = emptyBox('Aucune recharge'); return; }

  list.innerHTML = f.map(r => {
    const u = r.users || {};
    const statusMap = { paid: { l: '✅ Payé', c: 'green' }, pending: { l: '⏳ En attente', c: 'orange' }, rejected: { l: '❌ Rejeté', c: 'red' } };
    const s = statusMap[r.status] || { l: r.status, c: 'gray' };
    return '<div class="item-card">' +
      '<div class="ic-img">💳</div>' +
      '<div class="ic-body">' +
        '<div class="ic-name">' + escapeHtml(u.first_name || 'User') + ' <span class="badge ' + s.c + '">' + s.l + '</span></div>' +
        '<div class="ic-meta"><span>💰 ' + formatMoney(r.amount) + ' ' + escapeHtml(r.currency || 'FCFA') + '</span></div>' +
        '<div class="ic-meta"><span>💳 ' + escapeHtml(r.method || 'leekpay') + '</span></div>' +
        '<div class="ic-meta" style="font-size:10.5px;"><span>ID ' + (u.telegram_id || '—') + '</span><span class="dot">•</span><span>' + timeAgo(r.created_at) + '</span></div>' +
        (r.proof ? '<div class="ic-desc">🔑 ' + escapeHtml(r.proof) + '</div>' : '') +
        (r.admin_note ? '<div class="ic-desc">📝 ' + escapeHtml(r.admin_note) + '</div>' : '') +
      '</div>' +
      '<div class="ic-actions">' +
        (r.status === 'pending' ?
          '<button class="icon-btn" onclick="approveRecharge(' + r.id + ')" title="Approuver">✅</button>' +
          '<button class="icon-btn" onclick="rejectRecharge(' + r.id + ')" title="Rejeter">❌</button>'
          : '') +
      '</div>' +
    '</div>';
  }).join('');
}

document.getElementById('rechargesFilters').addEventListener('click', (e) => {
  const c = e.target.closest('.filter-chip'); if (!c) return;
  document.querySelectorAll('#rechargesFilters .filter-chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  R_FILTER = c.dataset.filter;
  loadRecharges();
});

async function approveRecharge(id) {
  if (!confirm('Approuver cette recharge ?')) return;
  const r = await fetch('/admin/api/admin/shop', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resource: 'recharge', id, action: 'approve' }),
  });
  const d = await r.json();
  if (d.error) return showToast('Erreur : ' + d.error, true);
  showToast('✅ Recharge validée');
  loadRecharges();
}

async function rejectRecharge(id) {
  const reason = prompt('Motif du rejet :');
  if (!reason) return;
  await fetch('/admin/api/admin/shop', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resource: 'recharge', id, action: 'reject', reason }),
  });
  showToast('❌ Recharge rejetée');
  loadRecharges();
}

// ==================== PACKS ====================
async function loadPacks() {
  const r = await fetch('/admin/api/admin/shop?resource=packs');
  const d = await r.json();
  if (d.ok) {
    DATA.packs = d.packs || [];
    renderPacks();
  }
}

function renderPacks() {
  const list = document.getElementById('packsList');
  if (!list) return;
  if (DATA.packs.length === 0) { list.innerHTML = emptyBox('Aucun pack'); return; }
  list.innerHTML = DATA.packs.map(p => '<div class="item-card">' +
    '<div class="ic-img">' + (p.icon || '💰') + '</div>' +
    '<div class="ic-body">' +
      '<div class="ic-name">' + escapeHtml(p.name) + (p.is_popular ? ' <span class="badge orange">⭐ Populaire</span>' : '') + (p.is_active ? '' : ' <span class="badge red">Inactif</span>') + '</div>' +
      '<div class="ic-meta"><span>💰 ' + formatMoney(p.price) + ' ' + escapeHtml(p.currency) + '</span><span class="dot">•</span><span>🪙 ' + formatMoney(p.kobo_amount) + ' Kobo</span></div>' +
      (p.bonus_percent > 0 ? '<div class="ic-meta"><span style="color:#10B981;font-weight:700;">🎁 Bonus +' + p.bonus_percent + '%</span></div>' : '') +
    '</div>' +
    '<div class="ic-actions">' +
      '<button class="icon-btn" onclick="editPack(' + p.id + ')">✏️</button>' +
      '<button class="icon-btn" onclick="deletePack(' + p.id + ')">🗑️</button>' +
    '</div>' +
  '</div>').join('');
}

function openPackModal(id) {
  const p = id ? DATA.packs.find(x => x.id === id) : { name: '', price: 700, currency: 'XOF', kobo_amount: 1000, bonus_percent: 0, icon: '💰', is_popular: false, position: 0, is_active: true };
  openModal(id ? 'Modifier le pack' : 'Nouveau pack',
    '<div class="form-group"><label>Nom</label><input id="pkName" value="' + escapeHtml(p.name) + '" placeholder="Ex: Starter"></div>' +
    '<div class="form-group"><label>Icône (emoji)</label><input id="pkIcon" value="' + escapeHtml(p.icon || '💰') + '" maxlength="4"></div>' +
    '<div class="form-group"><label>Prix (FCFA)</label><input type="number" id="pkPrice" value="' + p.price + '"></div>' +
    '<div class="form-group"><label>Kobo reçus</label><input type="number" id="pkKobo" value="' + p.kobo_amount + '"></div>' +
    '<div class="form-group"><label>Bonus (%)</label><input type="number" id="pkBonus" value="' + (p.bonus_percent || 0) + '"></div>' +
    '<div class="form-group"><label>Position</label><input type="number" id="pkPos" value="' + (p.position || 0) + '"></div>' +
    '<div class="form-group"><label><input type="checkbox" id="pkPopular" ' + (p.is_popular ? 'checked' : '') + ' style="width:auto;"> Populaire</label></div>' +
    '<div class="form-group"><label><input type="checkbox" id="pkActive" ' + (p.is_active ? 'checked' : '') + ' style="width:auto;"> Actif</label></div>' +
    '<button class="btn-primary" onclick="savePack(' + (id || 'null') + ')">💾 Enregistrer</button>');
}

async function savePack(id) {
  const payload = {
    name: document.getElementById('pkName').value.trim(),
    icon: document.getElementById('pkIcon').value.trim() || '💰',
    price: Number(document.getElementById('pkPrice').value),
    kobo_amount: Number(document.getElementById('pkKobo').value),
    bonus_percent: Number(document.getElementById('pkBonus').value),
    position: Number(document.getElementById('pkPos').value),
    is_popular: document.getElementById('pkPopular').checked,
    is_active: document.getElementById('pkActive').checked,
    currency: 'XOF',
  };
  if (!payload.name) return showToast('Nom requis', true);

  const res = await fetch('/admin/api/admin/shop', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ resource: id ? 'pack' : 'pack_create', id }, payload)),
  });
  const d = await res.json();
  if (d.error) return showToast('Erreur : ' + d.error, true);
  showToast(id ? 'Modifié' : 'Créé');
  closeModal();
  loadPacks();
}

function editPack(id) { openPackModal(id); }

async function deletePack(id) {
  if (!confirm('Désactiver ce pack ?')) return;
  await fetch('/admin/api/admin/shop', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resource: 'pack_delete', id }),
  });
  showToast('Désactivé');
  loadPacks();
}

// ==================== STATS ====================
function renderStats() {
  const list = document.getElementById('statsList');
  if (!list) return;
  const p = DATA.stats.purchases || {};
  const r = DATA.stats.recharges || {};
  list.innerHTML =
    '<div class="stats-grid">' +
      '<div class="stat-box green"><div class="lbl">💰 Revenus achats Kobo</div><div class="val">' + formatMoney(p.revenue || 0) + ' FCFA</div></div>' +
      '<div class="stat-box green"><div class="lbl">💰 Revenus recharges</div><div class="val">' + formatMoney(r.revenue || 0) + ' FCFA</div></div>' +
      '<div class="stat-box"><div class="lbl">🪙 Kobo vendus</div><div class="val">' + formatMoney(p.kobo_sold || 0) + '</div></div>' +
      '<div class="stat-box orange"><div class="lbl">⏳ Achats en attente</div><div class="val">' + (p.pending || 0) + '</div></div>' +
      '<div class="stat-box orange"><div class="lbl">⏳ Recharges en attente</div><div class="val">' + (r.pending || 0) + '</div></div>' +
      '<div class="stat-box blue"><div class="lbl">🛒 Total achats</div><div class="val">' + (p.total || 0) + '</div></div>' +
      '<div class="stat-box blue"><div class="lbl">💳 Total recharges</div><div class="val">' + (r.total || 0) + '</div></div>' +
      '<div class="stat-box red"><div class="lbl">❌ Rejetés</div><div class="val">' + ((p.rejected || 0) + (r.rejected || 0)) + '</div></div>' +
    '</div>' +
    '<div style="margin-top:20px;padding:16px;background:#fff;border-radius:14px;">' +
      '<div style="font-weight:800;margin-bottom:10px;">💰 Résumé financier</div>' +
      '<div style="font-size:14px;line-height:1.8;">' +
        '<b>Total encaissé :</b> <span style="color:var(--kobo-green);font-weight:800;">' + formatMoney((p.revenue || 0) + (r.revenue || 0)) + ' FCFA</span><br>' +
        '<b>Kobo vendus :</b> ' + formatMoney(p.kobo_sold || 0) + '<br>' +
        '<b>Valeur en FCFA :</b> ' + formatMoney((p.kobo_sold || 0) * 0.7) + ' FCFA' +
      '</div>' +
    '</div>';
}

document.querySelector('[data-tab="stats"]').addEventListener('click', () => {
  renderStats();
});
</script>
